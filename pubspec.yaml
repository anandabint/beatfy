name: beatfy
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.2+2

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # State management (Architecture.md § 1)
  flutter_riverpod: ^3.4.2

  # Local storage  hive_ce: actively maintained community continuation of
  # Hive (original `hive` last published 4 years ago). Drop-in API-compatible,
  # reported to Pann and approved before use.
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.3.4

  # Audio playback engine + background/session (Architecture.md § 1)
  just_audio: ^0.10.6
  audio_service: ^0.18.19
  # Already pulled in transitively by just_audio/audio_service; declared
  # directly because output_detector.dart imports it for the standard
  # Android "becoming noisy" (output disconnect) broadcast.
  audio_session: ^0.2.4

  # Library scan  MediaStore audio query. Evaluated alternatives
  # (on_audio_query_pluse, flutter_music_picker) at scaffold time; none had
  # meaningfully better maintenance signal, kept as default per Architecture.md.
  on_audio_query: ^2.9.0

  # Misc
  uuid: ^4.6.0
  # Sudah resolve transitif lewat dependency lain; dipromosikan jadi direct
  # dependency karena dipakai langsung di library_repository.dart (folder
  # grouping, PRD.md § 7 poin 6) dan cloud_backup_service.dart (nama file
  # upload/restore Drive).
  path: ^1.9.1
  # Pinned below 13.0.0: that version bumps Android compileSdk to 37, which
  # this machine's SDK Manager cannot resolve yet (installs as "android-37.0",
  # AGP looks for "android-37"  a real environment gap, not our bug).
  permission_handler: ^12.0.0
  google_sign_in: ^7.2.0
  share_plus: ^13.3.0
  volume_controller: ^3.6.0

  # Cloud backup (Architecture.md § 7, PRD.md § 7 poin 5)
  googleapis: ^15.0.0
  connectivity_plus: ^7.0.0
  http: ^1.5.0

  # Section "Tentang" di Settings (PRD.md § 7 poin 10, Design.md § 7)
  package_info_plus: ^10.2.1
  url_launcher: ^6.3.1

  # Performance gate (PRD.md § 11, Architecture.md § 1)  Android default caps
  # render di 60Hz meski device support lebih tinggi; set ke Hz maksimum device.
  flutter_displaymode: ^0.6.0

  # Sesi finalisasi (Architecture.md § 7b)  ambient color dinamis Now
  # Playing dari dominant color artwork.
  palette_generator: ^0.3.3

  # Home screen widget (docs/prompt_home_widget.md); jembatan Flutter ke
  # App Widget native (RemoteViews/AppWidgetProvider Kotlin). Cuma dipakai
  # untuk push data (title/artist/artwork/playing) + trigger redraw; tombol
  # prev/play-pause/next widget TIDAK lewat callback Dart home_widget;
  # langsung native PendingIntent ke
  # `com.ryanheise.audioservice.MediaButtonReceiver` yang sudah ada, sama
  # persis jalur yang dipakai notification media control (lihat
  # `BeatfyHomeWidgetProvider.kt`).
  home_widget: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

  # Code generation for Hive TypeAdapters (Schema.md)
  hive_ce_generator: ">=1.11.0 <1.11.3"
  build_runner: ^2.15.1

  # Sesi finalisasi (Architecture.md § 7b)  generator app icon custom dari
  # logo.png, dev-only tool (tidak dibundling ke APK final).
  flutter_launcher_icons: ^0.14.4

  # Splash screen (Design.md § 7)  generator splash native Android dari
  # config di bawah, dev-only tool (tidak dibundling ke APK final).
  flutter_native_splash: ^2.4.3

flutter_native_splash:
  color: "#141414"
  image: assets/splash/splash_screen.png
  android_12:
    color: "#141414"
    image: assets/splash/splash_screen.png

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Variable.ttf

  assets:
    - assets/icon/logo.png

# Sesi finalisasi (Architecture.md § 7b)  app icon custom, generate lewat
# `dart run flutter_launcher_icons` (legacy + adaptive icon Android 8+).
# Background adaptive icon dicocokkan ke canvas dark tema app (Design.md §2)
#  logo.png sendiri full-bleed tanpa padding bawaan, jadi dipakai apa
# adanya untuk foreground+legacy (tidak di-resize manual, sesuai instruksi).
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/logo.png"
  min_sdk_android: 24
  adaptive_icon_background: "#141414"
  adaptive_icon_foreground: "assets/icon/logo.png"
